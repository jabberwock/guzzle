[package]
name = "guzzle"
version = "0.2.1"
description = "libFuzzer GUI Frontend"
authors = []
edition = "2021"

[lib]
name = "guzzle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "guzzle"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
keyring = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tree-sitter = "0.22"
tree-sitter-c = "0.21"
which = "6"
anyhow = "1"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
